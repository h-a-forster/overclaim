[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "overclaim"
version = "0.1.0"
description = "Measure how often coding agents claim success they did not achieve: the agent's own claim, scored against a hidden check."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "overclaim contributors" }]
keywords = ["agents", "llm", "evaluation", "coding-agents", "claude-code", "honesty", "false-completion", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/h-a-forster/overclaim"
Documentation = "https://github.com/h-a-forster/overclaim/tree/main/docs"
Issues = "https://github.com/h-a-forster/overclaim/issues"
Changelog = "https://github.com/h-a-forster/overclaim/blob/main/CHANGELOG.md"

[project.scripts]
overclaim = "overclaim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/overclaim"]

[tool.hatch.build.targets.sdist]
include = ["src/overclaim", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Task repos are fixtures with deliberate defects; linting them would change the tasks.
extend-exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
